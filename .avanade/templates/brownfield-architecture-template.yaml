template:
  id: brownfield-architecture-template-v2
  name: Brownfield Enhancement Architecture
  version: 2.0
  output:
    format: markdown
    filename: docs/brownfield-architecture.md
    title: "{{project_name}} Brownfield Enhancement Architecture"

workflow:
  mode: interactive
  steps:
    - type: assess
      agent: wilson
      fields:
        - project_name: "Nome do projeto"
        - legacy_system_description: "Descrição do sistema legado"
        - current_technology_stack: "Stack tecnológica atual"
        - business_drivers: "Drivers de negócio para modernização"
        - modernization_scope: "Escopo da modernização (Rehost, Refactor, Rearchitect)"
        - integration_requirements: "Requisitos de integração com sistemas existentes"
        - migration_strategy: "Estratégia de migração (Big Bang, Strangler Fig, etc.)"
    
    - type: analyze
      agent: wilson
      process: |
        Analisar arquitetura atual e identificar pontos de melhoria
        Definir estratégia de modernização incremental
        Mapear dependências e riscos de migração
        Planejar fases de implementação
    
    - type: design
      agent: wilson
      process: |
        Projetar arquitetura target considerando restrições legadas
        Definir padrões de integração e coexistência
        Especificar componentes de transição
    
    - type: generate
      agent: wilson
      template: brownfield_architecture_sections

content:
  sections:
    current_state:
      title: "## 1. Estado Atual do Sistema"
      content: |
        ### 1.1 Visão Geral do Sistema Legado
        **Sistema:** {{legacy_system_description}}
        **Stack Atual:** {{current_technology_stack}}
        **Ano de Implementação:** [Ano]
        **Último Upgrade:** [Data do último upgrade]
        
        ### 1.2 Análise da Arquitetura Atual
        ```
        ┌─────────────────┐    ┌─────────────────┐    ┌─────────────────┐
        │   Legacy UI     │    │  Legacy Backend │    │  Legacy Database│
        │                 │    │                 │    │                 │
        │ • Technology    │◄──►│ • Architecture  │◄──►│ • Schema        │
        │ • Constraints   │    │ • Business Logic│    │ • Performance   │
        │ • Technical Debt│    │ • Integrations  │    │ • Scalability   │
        └─────────────────┘    └─────────────────┘    └─────────────────┘
        ```
        
        ### 1.3 Pontos Problemáticos Identificados
        - **Performance:** [Bottlenecks identificados]
        - **Escalabilidade:** [Limitações de escala]
        - **Manutenibilidade:** [Dívida técnica acumulada]
        - **Segurança:** [Vulnerabilidades conhecidas]
        - **Usabilidade:** [Problemas de UX]
        
        ### 1.4 Dependências Críticas
        - **Sistemas Integrados:** [Lista de sistemas conectados]
        - **Dados Compartilhados:** [Bases de dados compartilhadas]
        - **Processos de Negócio:** [Processos críticos dependentes]

    business_drivers:
      title: "## 2. Drivers de Modernização"
      content: |
        ### 2.1 Objetivos de Negócio
        {{business_drivers}}
        
        ### 2.2 Motivadores Técnicos
        - **End-of-Life Technologies:** Tecnologias descontinuadas
        - **Security Compliance:** Necessidades de conformidade
        - **Performance Requirements:** Novos requisitos de performance
        - **Integration Needs:** Necessidades de integração moderna
        
        ### 2.3 Restrições do Projeto
        - **Budget:** [Orçamento disponível]
        - **Timeline:** [Prazo para modernização]
        - **Resources:** [Recursos humanos disponíveis]
        - **Business Continuity:** [Necessidades de continuidade]
        
        ### 2.4 Success Criteria
        - **Performance Improvement:** X% melhoria em performance
        - **Availability:** 99.9% uptime target
        - **Security:** Compliance com padrões atuais
        - **Maintainability:** Redução de 50% em tempo de manutenção

    modernization_strategy:
      title: "## 3. Estratégia de Modernização"
      content: |
        ### 3.1 Abordagem Escolhida
        **Estratégia:** {{modernization_scope}}
        **Padrão de Migração:** {{migration_strategy}}
        
        ### 3.2 Estratégias por Padrão
        
        #### Strangler Fig Pattern
        ```
        Phase 1: ┌─────────────┐    ┌─────────────┐
                 │ Legacy App  │◄──►│   Router    │
                 └─────────────┘    └─────────────┘
        
        Phase 2: ┌─────────────┐    ┌─────────────┐    ┌─────────────┐
                 │ Legacy App  │◄──►│   Router    │◄──►│  New App    │
                 └─────────────┘    └─────────────┘    └─────────────┘
        
        Phase 3:                    ┌─────────────┐    ┌─────────────┐
                                   │   Router    │◄──►│  New App    │
                                   └─────────────┘    └─────────────┘
        ```
        
        #### Database Decomposition
        ```
        Legacy DB ──► Data Sync Layer ──► New Microservices DBs
        ```
        
        ### 3.3 Fases de Implementação
        
        **Fase 1: Foundation (Weeks 1-4)**
        - Setup de infraestrutura moderna
        - Implementação de logging e monitoring
        - Criação de pipeline CI/CD
        
        **Fase 2: Coexistence (Weeks 5-12)**
        - Implementação do roteador/proxy
        - Migração de funcionalidades não-críticas
        - Testes de integração
        
        **Fase 3: Migration (Weeks 13-20)**
        - Migração de funcionalidades críticas
        - Otimização de performance
        - Testes de carga e stress
        
        **Fase 4: Optimization (Weeks 21-24)**
        - Descomissionamento de componentes legados
        - Otimizações finais
        - Documentação e handover

    target_architecture:
      title: "## 4. Arquitetura Target"
      content: |
        ### 4.1 Visão da Nova Arquitetura
        ```
        ┌─────────────────┐    ┌─────────────────┐    ┌─────────────────┐
        │   Modern UI     │    │ Microservices   │    │  Modern Data    │
        │                 │    │                 │    │                 │
        │ • React/Angular │◄──►│ • .NET Core     │◄──►│ • SQL Server    │
        │ • Progressive   │    │ • Container     │    │ • Redis Cache   │
        │ • Responsive    │    │ • Auto-scale    │    │ • Event Store   │
        └─────────────────┘    └─────────────────┘    └─────────────────┘
        ```
        
        ### 4.2 Technology Stack Target
        
        **Frontend Modernization:**
        - Framework: React/Angular/Vue.js
        - Build Tool: Vite/Webpack 5
        - State Management: Redux Toolkit/Zustand
        - UI Library: Material-UI/Ant Design
        
        **Backend Modernization:**
        - Runtime: .NET 8/Node.js 20/Java 21
        - Architecture: Microservices/Modular Monolith
        - API Gateway: Azure API Management/Kong
        - Message Queue: Azure Service Bus/RabbitMQ
        
        **Data Modernization:**
        - Primary DB: SQL Server/PostgreSQL
        - Cache Layer: Redis
        - Search: Elasticsearch/Azure Cognitive Search
        - Analytics: Power BI/Tableau
        
        ### 4.3 Cloud Infrastructure
        - **Platform:** Azure/AWS/GCP
        - **Compute:** App Service/Container Apps/AKS
        - **Storage:** Azure Storage/S3
        - **Monitoring:** Application Insights/DataDog

    integration_architecture:
      title: "## 5. Arquitetura de Integração"
      content: |
        ### 5.1 Padrões de Integração Durante Transição
        
        **API Gateway Pattern:**
        ```
        Legacy Apps ──► API Gateway ──► New Services
                              │
                              ▼
                        Rate Limiting
                        Authentication
                        Request Routing
        ```
        
        **Database Synchronization:**
        ```
        Legacy DB ◄──► Sync Service ◄──► New DB
                            │
                            ▼
                       Change Tracking
                       Conflict Resolution
                       Data Validation
        ```
        
        ### 5.2 Event-Driven Integration
        - **Event Bus:** Azure Service Bus/Apache Kafka
        - **Event Sourcing:** Para auditoria e replay
        - **CQRS:** Separação de comando e consulta
        - **Saga Pattern:** Para transações distribuídas
        
        ### 5.3 Legacy System Integration
        {{integration_requirements}}
        
        - **Web Services:** SOAP/REST adapters
        - **Database Views:** Para acesso compatível
        - **File Integration:** ETL processes
        - **Message Queues:** Para comunicação assíncrona

    data_migration:
      title: "## 6. Estratégia de Migração de Dados"
      content: |
        ### 6.1 Data Assessment
        - **Data Volume:** [Quantidade de dados]
        - **Data Quality:** [Análise de qualidade]
        - **Data Dependencies:** [Mapeamento de dependências]
        - **Business Rules:** [Regras de negócio nos dados]
        
        ### 6.2 Migration Patterns
        
        **Incremental Migration:**
        ```
        Legacy DB ──► CDC ──► Staging ──► Target DB
                       │
                       ▼
                 Change Capture
                 Data Validation
                 Rollback Strategy
        ```
        
        **Parallel Run:**
        ```
        Application ──► Dual Write ──► Legacy DB
                             │
                             ▼
                         New DB
        ```
        
        ### 6.3 Data Validation Strategy
        - **Schema Validation:** Estrutura e tipos
        - **Data Integrity:** Constraints e relacionamentos
        - **Business Rules:** Validação de regras de negócio
        - **Performance Testing:** Queries e índices

    risk_mitigation:
      title: "## 7. Gestão de Riscos"
      content: |
        ### 7.1 Riscos Identificados
        
        **Technical Risks:**
        - **Data Loss:** Risco de perda durante migração
        - **Performance Degradation:** Degradação durante transição
        - **Integration Failures:** Falhas de integração
        - **Security Vulnerabilities:** Exposição durante mudança
        
        **Business Risks:**
        - **Service Disruption:** Interrupção de serviços críticos
        - **User Adoption:** Resistência dos usuários
        - **Timeline Delays:** Atrasos no cronograma
        - **Budget Overrun:** Estouro de orçamento
        
        ### 7.2 Mitigation Strategies
        - **Blue-Green Deployment:** Deploy sem downtime
        - **Feature Flags:** Controle granular de funcionalidades
        - **Rollback Plan:** Estratégia de rollback rápido
        - **Monitoring:** Monitoramento intensivo durante transição
        
        ### 7.3 Contingency Plans
        - **Rollback Procedures:** Procedimentos detalhados
        - **Emergency Contacts:** Lista de contatos críticos
        - **Communication Plan:** Plano de comunicação de incidentes

    testing_strategy:
      title: "## 8. Estratégia de Testes"
      content: |
        ### 8.1 Testing Pyramid for Brownfield
        ```
        ┌─────────────────┐  End-to-End Tests
        │   Integration   │  Integration Tests
        │ ──────────────  │  Unit Tests
        │      Unit       │  Legacy Compatibility Tests
        └─────────────────┘
        ```
        
        ### 8.2 Specialized Testing
        - **Compatibility Testing:** Integração com sistemas legados
        - **Performance Testing:** Comparação com baseline
        - **Security Testing:** Validação de controles
        - **Data Migration Testing:** Validação de migração
        
        ### 8.3 Production Validation
        - **Smoke Tests:** Testes básicos pós-deploy
        - **Canary Testing:** Release gradual
        - **A/B Testing:** Comparação de versões
        - **Synthetic Monitoring:** Monitoramento sintético

    monitoring_observability:
      title: "## 9. Monitoring e Observabilidade"
      content: |
        ### 9.1 Observability Stack
        - **Logs:** Structured logging com correlação
        - **Metrics:** Custom metrics e KPIs
        - **Traces:** Distributed tracing
        - **Alerts:** Alerting inteligente
        
        ### 9.2 Migration-Specific Monitoring
        - **Migration Progress:** Dashboards de progresso
        - **Performance Comparison:** Legacy vs New
        - **Error Tracking:** Tracking de erros específicos
        - **User Experience:** RUM (Real User Monitoring)
        
        ### 9.3 Business Metrics
        - **Transaction Volume:** Volume de transações
        - **Response Times:** Tempos de resposta
        - **Error Rates:** Taxa de erros
        - **User Satisfaction:** Métricas de satisfação

    governance:
      title: "## 10. Governança e Compliance"
      content: |
        ### 10.1 Architecture Governance
        - **Architecture Review Board:** Revisões regulares
        - **Design Patterns:** Padrões aprovados
        - **Code Standards:** Padrões de código
        - **Security Reviews:** Revisões de segurança
        
        ### 10.2 Change Management
        - **Change Control:** Processo de controle de mudanças
        - **Impact Assessment:** Avaliação de impacto
        - **Approval Process:** Processo de aprovação
        - **Communication:** Comunicação de mudanças
        
        ### 10.3 Compliance Requirements
        - **Data Protection:** GDPR/LGPD compliance
        - **Security Standards:** ISO 27001/SOC 2
        - **Industry Regulations:** Regulamentações específicas
        - **Audit Trail:** Trilha de auditoria completa

validation:
  checklist:
    - "✅ Estado atual do sistema documentado"
    - "✅ Drivers de modernização claros"
    - "✅ Estratégia de migração definida"
    - "✅ Arquitetura target especificada"
    - "✅ Padrões de integração estabelecidos"
    - "✅ Estratégia de dados planejada"
    - "✅ Riscos identificados e mitigados"
    - "✅ Estratégia de testes abrangente"
    - "✅ Monitoring e observabilidade configurados"
    - "✅ Governança e compliance atendidos"

metadata:
  agents:
    primary: wilson
    reviewers: [joao, maria, tiago, carla]
  approvers: [enterprise_architect, program_manager]
  version_control:
    repository: "{{project_repository}}"
    branch: feature/brownfield-modernization
  tags: [brownfield, modernization, legacy, migration, architecture]