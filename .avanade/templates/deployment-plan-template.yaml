template:
  id: deployment-plan-template-v2
  name: Deployment Plan Document
  version: 2.0
  output:
    format: markdown
    filename: docs/deployment-plan.md
    title: "{{project_name}} Deployment Plan"

workflow:
  mode: interactive
  steps:
    - type: elicit
      agent: tiago
      fields:
        - project_name: "Nome do projeto"
        - deployment_type: "Tipo de deployment (Greenfield, Brownfield, Migration)"
        - target_environments: "Ambientes alvo (Dev, Test, Staging, Prod)"
        - technology_stack: "Stack tecnológica"
        - deployment_strategy: "Estratégia (Blue-Green, Canary, Rolling)"
        - rollback_requirements: "Requisitos de rollback"
        - maintenance_window: "Janela de manutenção disponível"
    
    - type: analyze
      agent: tiago
      process: |
        Analisar complexidade do deployment e dependências
        Identificar riscos e pontos de falha
        Definir sequência de deployment e validações
    
    - type: generate
      agent: tiago
      template: deployment_plan_sections

content:
  sections:
    overview:
      title: "## 1. Visão Geral do Deployment"
      content: |
        ### 1.1 Contexto do Projeto
        **Nome do Projeto:** {{project_name}}
        **Tipo de Deployment:** {{deployment_type}}
        **Estratégia:** {{deployment_strategy}}
        **Janela de Manutenção:** {{maintenance_window}}
        
        ### 1.2 Objetivos do Deployment
        - **Zero Downtime:** Deployment sem interrupção de serviço
        - **Rollback Capability:** Capacidade de rollback em caso de problemas
        - **Validation:** Validação automática pós-deployment
        - **Monitoring:** Monitoramento contínuo durante e após deployment
        
        ### 1.3 Resumo Executivo
        Este plano define a estratégia de deployment para {{project_name}}, 
        incluindo sequência de atividades, validações necessárias, 
        estratégias de rollback e procedimentos de monitoramento.

    architecture:
      title: "## 2. Arquitetura de Deployment"
      content: |
        ### 2.1 Stack Tecnológica
        {{technology_stack}}
        
        ### 2.2 Componentes da Aplicação
        ```
        ┌─────────────────┐    ┌─────────────────┐    ┌─────────────────┐
        │   Frontend      │    │    Backend      │    │   Database      │
        │                 │    │                 │    │                 │
        │ • React/Angular │◄──►│ • .NET Core     │◄──►│ • SQL Server    │
        │ • Static Files  │    │ • APIs          │    │ • Redis Cache   │
        │ • CDN           │    │ • Background    │    │ • File Storage  │
        └─────────────────┘    └─────────────────┘    └─────────────────┘
        ```
        
        ### 2.3 Ambientes Alvo
        {{target_environments}}
        
        **Development:**
        - **URL:** https://dev-{{project_name}}.azurewebsites.net
        - **Database:** dev-{{project_name}}-sql
        - **Purpose:** Desenvolvimento e testes iniciais
        
        **Testing:**
        - **URL:** https://test-{{project_name}}.azurewebsites.net  
        - **Database:** test-{{project_name}}-sql
        - **Purpose:** Testes de integração e QA
        
        **Staging:**
        - **URL:** https://staging-{{project_name}}.azurewebsites.net
        - **Database:** staging-{{project_name}}-sql
        - **Purpose:** UAT e testes de aceitação
        
        **Production:**
        - **URL:** https://{{project_name}}.com
        - **Database:** prod-{{project_name}}-sql
        - **Purpose:** Ambiente de produção

    deployment_strategy:
      title: "## 3. Estratégia de Deployment"
      content: |
        ### 3.1 Estratégia Escolhida: {{deployment_strategy}}
        
        #### Blue-Green Deployment
        ```
        Step 1: ┌─────────┐    ┌─────────┐
                │  Blue   │    │  Green  │
                │(Current)│    │ (New)   │
                │   100%  │    │    0%   │
                └─────────┘    └─────────┘
        
        Step 2: ┌─────────┐    ┌─────────┐
                │  Blue   │    │  Green  │
                │(Current)│    │ (New)   │
                │   100%  │◄──►│  Ready  │
                └─────────┘    └─────────┘
        
        Step 3: ┌─────────┐    ┌─────────┐
                │  Blue   │    │  Green  │
                │ (Old)   │    │(Current)│
                │    0%   │    │  100%   │
                └─────────┘    └─────────┘
        ```
        
        #### Canary Deployment
        ```
        Phase 1: ┌─────────┐    ┌─────────┐
                 │ Current │    │ Canary  │
                 │   95%   │    │   5%    │
                 └─────────┘    └─────────┘
        
        Phase 2: ┌─────────┐    ┌─────────┐
                 │ Current │    │ Canary  │
                 │   80%   │    │  20%    │
                 └─────────┘    └─────────┘
        
        Phase 3: ┌─────────┐    ┌─────────┐
                 │ Current │    │ Canary  │
                 │    0%   │    │  100%   │
                 └─────────┘    └─────────┘
        ```
        
        ### 3.2 Justificativa da Estratégia
        - **Zero Downtime:** Sem interrupção de serviço
        - **Risk Mitigation:** Deployment gradual reduz riscos
        - **Quick Rollback:** Rollback rápido em caso de problemas
        - **Validation:** Validação em ambiente real com tráfego limitado

    infrastructure:
      title: "## 4. Infraestrutura e DevOps"
      content: |
        ### 4.1 Infraestrutura Cloud
        ```yaml
        azure_resources:
          resource_group: rg-{{project_name}}-prod
          app_service_plan: asp-{{project_name}}-prod
          web_apps:
            - wa-{{project_name}}-blue
            - wa-{{project_name}}-green
          sql_database: sqldb-{{project_name}}-prod
          sql_server: sql-{{project_name}}-prod
          storage_account: st{{project_name}}prod
          key_vault: kv-{{project_name}}-prod
          app_insights: ai-{{project_name}}-prod
        ```
        
        ### 4.2 Pipeline de CI/CD
        ```yaml
        pipeline_stages:
          - name: Build
            steps:
              - checkout_code
              - restore_dependencies  
              - build_application
              - run_unit_tests
              - publish_artifacts
          
          - name: Deploy_Dev
            steps:
              - deploy_to_dev
              - run_smoke_tests
              - notify_team
          
          - name: Deploy_Test
            steps:
              - deploy_to_test
              - run_integration_tests
              - run_api_tests
          
          - name: Deploy_Staging
            steps:
              - deploy_to_staging
              - run_e2e_tests
              - performance_tests
              - uat_notification
          
          - name: Deploy_Production
            approval: required
            steps:
              - backup_production
              - deploy_blue_green
              - health_checks
              - switch_traffic
              - post_deployment_tests
        ```
        
        ### 4.3 Configuration Management
        - **Environment Variables:** Azure App Configuration
        - **Secrets:** Azure Key Vault
        - **Connection Strings:** Key Vault references
        - **Feature Flags:** LaunchDarkly/Azure App Configuration

    database_strategy:
      title: "## 5. Estratégia de Database Deployment"
      content: |
        ### 5.1 Database Migration Strategy
        - **Migration Tool:** Entity Framework Migrations / Flyway
        - **Backup Strategy:** Full backup antes de cada deployment
        - **Rollback Strategy:** Backup restore + reverse migrations
        - **Validation:** Automated schema validation
        
        ### 5.2 Database Deployment Process
        ```yaml
        database_deployment:
          pre_deployment:
            - backup_database: true
            - validate_schema: true
            - check_disk_space: true
          
          deployment:
            - apply_migrations: true
            - update_schema: true
            - seed_data: conditional
          
          post_deployment:
            - validate_integrity: true
            - performance_check: true
            - update_statistics: true
        ```
        
        ### 5.3 Data Migration Considerations
        - **Zero Downtime:** Forward-compatible migrations
        - **Large Tables:** Batch processing for large data changes
        - **Constraints:** Temporary constraint removal if needed
        - **Monitoring:** Query performance monitoring during migration

    validation_testing:
      title: "## 6. Validação e Testes"
      content: |
        ### 6.1 Smoke Tests Automáticos
        ```yaml
        smoke_tests:
          - name: Application_Health
            endpoint: /health
            expected_status: 200
            timeout: 30s
          
          - name: Database_Connectivity
            test: SELECT 1
            expected_result: success
          
          - name: External_Services
            services: [payment_api, email_service]
            timeout: 60s
          
          - name: Critical_Endpoints
            endpoints: [/api/users, /api/orders]
            expected_status: [200, 401]
        ```
        
        ### 6.2 Health Checks
        - **Application Health:** Custom health check endpoints
        - **Database Health:** Connection and query validation
        - **Dependencies:** External service availability
        - **Performance:** Response time validation
        
        ### 6.3 Acceptance Criteria
        - **Response Time:** < 2 segundos para endpoints críticos
        - **Error Rate:** < 0.1% nos primeiros 30 minutos
        - **Availability:** 100% durante janela de deployment
        - **Functional:** Smoke tests passando 100%

    monitoring_alerting:
      title: "## 7. Monitoramento e Alerting"
      content: |
        ### 7.1 Métricas de Monitoramento
        
        **Application Metrics:**
        - Request rate and response time
        - Error rates and status codes
        - CPU and memory utilization
        - Database connection pool status
        
        **Business Metrics:**
        - User registration rate
        - Transaction completion rate
        - Revenue impact metrics
        - Customer satisfaction scores
        
        ### 7.2 Alerting Strategy
        ```yaml
        alerts:
          critical:
            - error_rate > 1%
            - response_time > 5s
            - availability < 99%
          
          warning:
            - error_rate > 0.5%
            - response_time > 3s
            - cpu_usage > 80%
          
          info:
            - deployment_started
            - deployment_completed
            - traffic_switch
        ```
        
        ### 7.3 Dashboard Configuration
        - **Real-time Monitoring:** Live deployment dashboard
        - **Business Impact:** KPI tracking during deployment
        - **System Health:** Infrastructure and application metrics
        - **User Experience:** Real user monitoring (RUM)

    rollback_procedures:
      title: "## 8. Procedimentos de Rollback"
      content: |
        ### 8.1 Critérios de Rollback
        {{rollback_requirements}}
        
        **Automatic Rollback Triggers:**
        - Error rate > 5% for 5+ minutes
        - Response time > 10 seconds for 3+ minutes  
        - Availability < 95% for 2+ minutes
        - Critical functionality unavailable
        
        **Manual Rollback Triggers:**
        - Business impact identified
        - Data corruption detected
        - Security incident
        - Performance degradation
        
        ### 8.2 Rollback Procedures
        
        #### Application Rollback
        ```bash
        # Blue-Green Rollback
        1. Switch traffic back to previous version
           az webapp traffic-routing set --distribution blue=100 green=0
        
        2. Verify application health
           curl -f https://{{project_name}}.com/health
        
        3. Monitor for 30 minutes
           watch curl -s https://{{project_name}}.com/health
        ```
        
        #### Database Rollback
        ```bash
        # Database Rollback (if needed)
        1. Stop application
           az webapp stop --name {{project_name}}
        
        2. Restore database backup
           az sql db restore --backup-time "2024-01-01T10:00:00"
        
        3. Restart application
           az webapp start --name {{project_name}}
        ```
        
        ### 8.3 Rollback Validation
        - **Functional Testing:** Critical path validation
        - **Data Integrity:** Database consistency checks
        - **Performance:** Baseline performance validation
        - **User Experience:** User journey validation

    security_compliance:
      title: "## 9. Segurança e Compliance"
      content: |
        ### 9.1 Security Checks
        - **Code Scanning:** Static analysis security testing
        - **Dependency Scanning:** Vulnerability assessment
        - **Secrets Management:** No hardcoded secrets
        - **Access Control:** Proper RBAC implementation
        
        ### 9.2 Compliance Requirements
        - **Data Protection:** GDPR/LGPD compliance validation
        - **Audit Trail:** Complete deployment audit log
        - **Change Management:** Approval workflow compliance
        - **Documentation:** Complete deployment documentation
        
        ### 9.3 Security Validation
        ```yaml
        security_checks:
          - name: OWASP_Scan
            tool: OWASP ZAP
            blocking: true
          
          - name: Dependency_Check
            tool: Snyk
            severity_threshold: high
          
          - name: Secrets_Scan
            tool: GitLeaks
            blocking: true
          
          - name: Infrastructure_Scan
            tool: Terraform Security
            compliance: SOC2
        ```

    communication_plan:
      title: "## 10. Plano de Comunicação"
      content: |
        ### 10.1 Stakeholders
        - **Development Team:** Real-time updates via Slack
        - **Business Users:** Email notifications for major milestones
        - **Support Team:** Detailed handover documentation
        - **Management:** Executive summary report
        
        ### 10.2 Communication Timeline
        
        **T-24 hours:**
        - Send deployment reminder to all stakeholders
        - Confirm maintenance window
        - Validate rollback procedures
        
        **T-1 hour:**
        - Final go/no-go decision
        - Notify support teams
        - Enable enhanced monitoring
        
        **T+0 (Deployment Start):**
        - Broadcast deployment start
        - Begin real-time status updates
        - Activate war room if needed
        
        **T+30 minutes:**
        - Initial health check results
        - Performance metrics summary
        - User feedback initial assessment
        
        **T+24 hours:**
        - Deployment success confirmation
        - Performance analysis
        - Lessons learned session
        
        ### 10.3 Escalation Matrix
        ```
        Level 1: Technical Issues
        ├── DevOps Engineer (Primary)
        ├── Lead Developer (Backup)
        └── Response Time: 15 minutes
        
        Level 2: Business Impact
        ├── Technical Lead (Primary)
        ├── Product Owner (Backup)  
        └── Response Time: 30 minutes
        
        Level 3: Executive Decision
        ├── Engineering Manager
        ├── VP Engineering
        └── Response Time: 60 minutes
        ```

validation:
  checklist:
    - "✅ Arquitetura de deployment definida"
    - "✅ Estratégia de deployment escolhida e justificada"
    - "✅ Pipeline de CI/CD configurado"
    - "✅ Estratégia de database definida"
    - "✅ Testes de validação estabelecidos"
    - "✅ Monitoramento e alerting configurados"
    - "✅ Procedimentos de rollback testados"
    - "✅ Segurança e compliance validados"
    - "✅ Plano de comunicação estabelecido"
    - "✅ Aprovações necessárias obtidas"

metadata:
  agents:
    primary: tiago
    reviewers: [wilson, joao]
  approvers: [devops_lead, release_manager]
  version_control:
    repository: "{{project_repository}}"
    branch: feature/deployment-plan
  tags: [deployment, devops, cicd, release, strategy]