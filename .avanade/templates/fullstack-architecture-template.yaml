template:
  id: fullstack-architecture-template-v2
  name: Full-Stack Architecture Document
  version: 2.0
  output:
    format: markdown
    filename: docs/fullstack-architecture.md
    title: "{{project_name}} Full-Stack Architecture Document"

workflow:
  mode: interactive
  steps:
    - type: elicit
      agent: wilson
      fields:
        - project_name: "Nome do projeto"
        - project_type: "Tipo de aplicação (Web App, Mobile App, Desktop)"
        - frontend_framework: "Framework frontend (React, Angular, Vue.js)"
        - backend_framework: "Framework backend (.NET Core, Node.js, Spring Boot)"
        - database_type: "Tipo de banco de dados (SQL Server, PostgreSQL, MongoDB)"
        - cloud_platform: "Plataforma cloud (Azure, AWS, GCP)"
        - architecture_pattern: "Padrão arquitetural (Microservices, Monolith, Serverless)"
    
    - type: analyze
      agent: wilson
      process: |
        Analisar requisitos de escalabilidade, performance e segurança
        Definir arquitetura de camadas e padrões de comunicação
        Mapear dependências entre componentes frontend e backend
    
    - type: generate
      agent: wilson
      template: fullstack_architecture_sections

content:
  sections:
    overview:
      title: "## 1. Visão Geral da Arquitetura Full-Stack"
      content: |
        ### 1.1 Contexto do Sistema
        **Nome do Projeto:** {{project_name}}
        **Tipo de Aplicação:** {{project_type}}
        **Padrão Arquitetural:** {{architecture_pattern}}
        **Plataforma Cloud:** {{cloud_platform}}
        
        ### 1.2 Objetivos Arquiteturais
        - **Escalabilidade:** Suporte a crescimento horizontal e vertical
        - **Disponibilidade:** Alta disponibilidade (99.9% uptime)
        - **Performance:** Resposta sub-segundo para operações críticas
        - **Segurança:** Conformidade com padrões enterprise
        - **Manutenibilidade:** Arquitetura limpa e bem documentada

    system_architecture:
      title: "## 2. Arquitetura do Sistema"
      content: |
        ### 2.1 Visão de Alto Nível
        ```
        ┌─────────────────┐    ┌─────────────────┐    ┌─────────────────┐
        │   Frontend      │    │    Backend      │    │   Data Layer    │
        │                 │    │                 │    │                 │
        │ • {{frontend_framework}}     │◄──►│ • {{backend_framework}}     │◄──►│ • {{database_type}}     │
        │ • SPA/PWA       │    │ • REST/GraphQL  │    │ • Cache Layer   │
        │ • State Mgmt    │    │ • Business Logic│    │ • File Storage  │
        └─────────────────┘    └─────────────────┘    └─────────────────┘
        ```
        
        ### 2.2 Camadas da Aplicação
        - **Presentation Layer:** Interface do usuário e experiência
        - **Application Layer:** Lógica de aplicação e orquestração
        - **Business Layer:** Regras de negócio e validações
        - **Data Access Layer:** Acesso e persistência de dados
        - **Infrastructure Layer:** Logging, monitoring, segurança

    technology_stack:
      title: "## 3. Stack Tecnológica Completa"
      content: |
        ### 3.1 Frontend Technologies
        - **Framework:** {{frontend_framework}}
        - **Language:** TypeScript
        - **Build Tool:** Vite/Webpack
        - **State Management:** Redux Toolkit/Zustand
        - **UI Library:** Material-UI/Ant Design
        - **Testing:** Jest + React Testing Library
        
        ### 3.2 Backend Technologies
        - **Framework:** {{backend_framework}}
        - **Language:** C#/.NET 8 / Node.js / Java
        - **API Style:** REST + GraphQL
        - **Authentication:** JWT + OAuth 2.0
        - **ORM:** Entity Framework / Prisma / JPA
        - **Testing:** xUnit / Jest / JUnit
        
        ### 3.3 Database & Storage
        - **Primary Database:** {{database_type}}
        - **Cache:** Redis
        - **Search Engine:** Elasticsearch (se necessário)
        - **File Storage:** Azure Blob Storage / S3
        - **Message Queue:** Azure Service Bus / RabbitMQ
        
        ### 3.4 DevOps & Infrastructure
        - **Container:** Docker + Kubernetes
        - **CI/CD:** GitHub Actions / Azure DevOps
        - **Monitoring:** Application Insights / Datadog
        - **Cloud Platform:** {{cloud_platform}}

    api_design:
      title: "## 4. Design de API"
      content: |
        ### 4.1 REST API Structure
        ```
        GET    /api/v1/users           # Listar usuários
        GET    /api/v1/users/{id}      # Buscar usuário por ID
        POST   /api/v1/users           # Criar usuário
        PUT    /api/v1/users/{id}      # Atualizar usuário
        DELETE /api/v1/users/{id}      # Deletar usuário
        ```
        
        ### 4.2 API Standards
        - **Versioning:** URI versioning (/api/v1/)
        - **Status Codes:** HTTP status codes padronizados
        - **Error Handling:** RFC 7807 Problem Details
        - **Rate Limiting:** Throttling baseado em usuário/IP
        - **Documentation:** OpenAPI 3.0 / Swagger
        
        ### 4.3 GraphQL Schema (se aplicável)
        ```graphql
        type User {
          id: ID!
          name: String!
          email: String!
          createdAt: DateTime!
        }
        
        type Query {
          users(first: Int, after: String): UserConnection!
          user(id: ID!): User
        }
        ```

    data_architecture:
      title: "## 5. Arquitetura de Dados"
      content: |
        ### 5.1 Database Design
        ```
        ┌─────────────────┐    ┌─────────────────┐    ┌─────────────────┐
        │   Application   │    │   Read Models   │    │   Write Models  │
        │                 │    │                 │    │                 │
        │ • CQRS Pattern  │◄──►│ • Denormalized  │◄──►│ • Normalized    │
        │ • Event Sourcing│    │ • Query Optimized│   │ • ACID Compliant│
        └─────────────────┘    └─────────────────┘    └─────────────────┘
        ```
        
        ### 5.2 Data Patterns
        - **CQRS:** Separação de comando e consulta
        - **Event Sourcing:** Histórico de eventos (se necessário)
        - **Database per Service:** Para microservices
        - **Saga Pattern:** Transações distribuídas
        
        ### 5.3 Data Management
        - **Backup Strategy:** Backups automáticos diários
        - **Migration Strategy:** Code-first migrations
        - **Data Retention:** Políticas de retenção de dados
        - **GDPR Compliance:** Conformidade com proteção de dados

    security_architecture:
      title: "## 6. Arquitetura de Segurança"
      content: |
        ### 6.1 Authentication & Authorization
        ```
        ┌─────────────┐    ┌─────────────┐    ┌─────────────┐
        │   Client    │────│  Identity   │────│  Resource   │
        │             │    │  Provider   │    │   Server    │
        │ • OAuth2    │    │ • Azure AD  │    │ • JWT Token │
        │ • PKCE      │    │ • Claims    │    │ • RBAC      │
        └─────────────┘    └─────────────┘    └─────────────┘
        ```
        
        ### 6.2 Security Measures
        - **Authentication:** Azure AD B2C / Auth0
        - **Authorization:** Role-based Access Control (RBAC)
        - **API Security:** JWT tokens + API keys
        - **Data Encryption:** Encryption at rest and in transit
        - **Network Security:** WAF + DDoS protection
        
        ### 6.3 Compliance & Auditing
        - **Logging:** Structured logging com correlação
        - **Monitoring:** Security event monitoring
        - **Compliance:** SOC 2, ISO 27001
        - **Penetration Testing:** Testes regulares de segurança

    scalability_performance:
      title: "## 7. Escalabilidade e Performance"
      content: |
        ### 7.1 Scaling Strategies
        - **Horizontal Scaling:** Auto-scaling baseado em métricas
        - **Database Scaling:** Read replicas + sharding
        - **Caching Strategy:** Multi-layer caching
        - **CDN:** Content delivery para recursos estáticos
        
        ### 7.2 Performance Optimization
        - **Backend Performance:**
          - Connection pooling
          - Query optimization
          - Response caching
          - Async processing
        
        - **Frontend Performance:**
          - Code splitting
          - Lazy loading
          - Bundle optimization
          - Image optimization
        
        ### 7.3 Monitoring & Alerts
        - **APM:** Application Performance Monitoring
        - **Health Checks:** Endpoints de saúde
        - **Metrics:** Custom metrics e dashboards
        - **Alerting:** Alertas proativos baseados em SLAs

    deployment_architecture:
      title: "## 8. Arquitetura de Deploy"
      content: |
        ### 8.1 Environment Strategy
        ```
        Development ──► Staging ──► Production
            │              │            │
            ▼              ▼            ▼
        Local Testing   UAT Testing   Live Traffic
        ```
        
        ### 8.2 Deployment Patterns
        - **Blue-Green Deployment:** Deploy sem downtime
        - **Canary Releases:** Rollout gradual
        - **Feature Flags:** Controle de funcionalidades
        - **Database Migrations:** Migrations automáticas
        
        ### 8.3 Infrastructure as Code
        ```yaml
        # Azure Resource Manager / Terraform
        resources:
          - App Service Plan
          - Web Apps (Frontend/Backend)
          - SQL Database
          - Redis Cache
          - Storage Account
          - Key Vault
        ```

    disaster_recovery:
      title: "## 9. Disaster Recovery & Backup"
      content: |
        ### 9.1 Backup Strategy
        - **Database Backups:** Point-in-time recovery
        - **Application Backups:** Container image registry
        - **Configuration Backups:** Infrastructure as Code
        - **Recovery Testing:** Testes regulares de recovery
        
        ### 9.2 High Availability
        - **Multi-Region:** Deployment em múltiplas regiões
        - **Load Balancing:** Distribuição de tráfego
        - **Failover:** Failover automático
        - **RTO/RPO:** Recovery Time/Point Objectives definidos

    integration_patterns:
      title: "## 10. Padrões de Integração"
      content: |
        ### 10.1 Internal Integration
        - **Service Mesh:** Istio/Linkerd para microservices
        - **Message Queues:** Async communication
        - **Event-Driven:** Event sourcing e CQRS
        - **Circuit Breaker:** Resilience patterns
        
        ### 10.2 External Integration
        - **Third-party APIs:** RESTful integration
        - **Webhooks:** Event notifications
        - **ETL Processes:** Data integration
        - **Partner Integration:** B2B API gateways

validation:
  checklist:
    - "✅ Arquitetura de alto nível definida"
    - "✅ Stack tecnológica completa aprovada"
    - "✅ Padrões de API estabelecidos"
    - "✅ Arquitetura de dados modelada"
    - "✅ Segurança enterprise implementada"
    - "✅ Estratégias de escalabilidade definidas"
    - "✅ Pipeline de deploy configurado"
    - "✅ Disaster recovery planejado"
    - "✅ Padrões de integração estabelecidos"
    - "✅ Documentação técnica completa"

metadata:
  agents:
    primary: wilson
    reviewers: [joao, maria, tiago]
  approvers: [solution_architect, technical_lead]
  version_control:
    repository: "{{project_repository}}"
    branch: feature/fullstack-architecture
  tags: [fullstack, architecture, microservices, cloud, security]